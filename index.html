<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication - Autenticación</title>
    
    <!-- Integración del Framework Bootstrap 5 para el diseño de la interfaz -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                
                <!-- Tarjeta Principal de Autenticación -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Encabezado del Módulo -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">Communication</h2>
                            <p class="text-muted">Plataforma de comunicación y colaboración</p>
                        </div>

                        <!-- Navegación por Pestañas (Login / Registro) -->
                        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Iniciar Sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Registrarse</button>
                            </li>
                        </ul>

                        <!-- Contenido de las Pestañas -->
                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- Formulario 1: Iniciar Sesión -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                                <form id="loginForm" novalidate>
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="loginEmail" placeholder="usuario@comunicacion.com" required>
                                        <div class="invalid-feedback">Por favor, ingrese un correo válido.</div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                        <div class="invalid-feedback">Ingrese su contraseña.</div>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberMe">
                                            <label class="form-check-label text-muted small" for="rememberMe">Recordarme</label>
                                        </div>
                                        <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
                                </form>
                            </div>

                            <!-- Formulario 2: Registro de Usuario -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel">
                                <form id="registerForm" novalidate>
                                    <div class="mb-3">
                                        <label for="regName" class="form-label">Nombre Completo</label>
                                        <input type="text" class="form-control" id="regName" placeholder="Juan Pérez" required>
                                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="regEmail" class="form-label">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="regEmail" placeholder="usuario@comunicacion.com" required>
                                        <div class="invalid-feedback">Ingrese un correo electrónico válido.</div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="regPassword" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                                        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Crear Cuenta</button>
                                </form>
                            </div>

                        </div> <!-- Fin tab-content -->

                        <!-- Contenedor para Alertas / Mensajes de Feedback -->
                        <div id="alertContainer" class="mt-4"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

 <!-- Scripts del Framework Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script de Lógica Externa en js/auth.js -->
    <script src="js/auth.js"></script>
</body>
</html>
